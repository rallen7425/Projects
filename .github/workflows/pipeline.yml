name: Content Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 300 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --output result.json \
            https://distilled-news.vercel.app/api/pipeline/trigger
          jq -e '.success == true and (.results | length > 0) and all(.results[]; .status != "failed")' result.json
          jq -r '.results[] | select(.status == "partial") | "::warning::zone \(.zone) partial — failed sources: \([.sources[] | select(.status == "failed") | .source] | join(", "))"' result.json
      - name: Show pipeline outcomes
        if: always()
        run: |
          if test -f result.json; then jq '{success, status, results}' result.json; fi
